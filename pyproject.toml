[project]
name = "bfit-bot"
version = "2.1.0"
description = "A Iliya Mun's helper Telegram bot that collects surveys about trainins and show information about the coach"
authors = [
    {name = "Alim Mun",email = "zhaba.v.kedah77@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "aiogram (>=3.29.0,<4.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "colorama (>=0.4.6,<0.5.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
